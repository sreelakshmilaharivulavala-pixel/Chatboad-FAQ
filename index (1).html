<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ Chatbot - {{ product }}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
    :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: radial-gradient(1200px 800px at 10% -10%, #6366f1 0%, transparent 40%), radial-gradient(1200px 800px at 110% 120%, #8b5cf6 0%, transparent 40%), var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3rem 1rem; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-weight: 800; font-size: 2.5rem; letter-spacing: -0.03em; background: linear-gradient(135deg, #fff 30%, #c7d2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: var(--muted); margin-top: 0.5rem; }
    .chat-container { width: 100%; max-width: 720px; background: var(--card); border: 1px solid rgba(255,255,255,0.06); border-radius: 1.5rem; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); backdrop-filter: blur(12px); }
    .messages { height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; padding-right: 0.25rem; }
    .message { max-width: 85%; padding: 1rem 1.25rem; border-radius: 1.25rem; line-height: 1.6; font-size: 0.95rem; animation: fadeIn 0.3s ease; }
    .message.user { align-self: flex-end; background: linear-gradient(135deg, var(--primary), #8b5cf6); color: #fff; border-bottom-right-radius: 0.25rem; }
    .message.bot { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-bottom-left-radius: 0.25rem; color: var(--text); }
    .message .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; opacity: 0.8; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .input-area { display: flex; gap: 0.75rem; }
    .input-area input { flex: 1; padding: 1rem 1.25rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: var(--text); font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .input-area input:focus { border-color: var(--primary); }
    .input-area button { padding: 1rem 1.5rem; border-radius: 1rem; border: none; background: linear-gradient(135deg, var(--primary), #8b5cf6); color: #fff; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
    .input-area button:hover { transform: translateY(-2px); }
    .suggestions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .suggestions button { padding: 0.5rem 0.75rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: var(--muted); font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
    .suggestions button:hover { border-color: var(--primary); color: var(--text); }
  </style>
</head>
<body>
  <header>
    <h1>FAQ Chatbot — {{ product }}</h1>
    <p>NLP-powered answers using TF-IDF + Cosine Similarity (SpaCy / NLTK)</p>
  </header>

  <main class="chat-container">
    <div class="suggestions" id="suggestions"></div>
    <div class="messages" id="messages">
      <div class="message bot">
        Hi! I'm the {{ product }} assistant. Ask me anything about battery, warranty, storage, ports, display, weight, or returns.
        <div class="meta">Type a question below or click a suggestion.</div>
      </div>
    </div>
    <form class="input-area" onsubmit="sendMessage(event)">
      <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>

  <script>
    const suggestions = [
      "How long does the battery last?",
      "What is the warranty period?",
      "Does it support external monitors?",
      "What are the storage options?",
      "How heavy is the laptop?"
    ];
    const sugContainer = document.getElementById('suggestions');
    suggestions.forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = s;
      btn.onclick = () => { document.getElementById('userInput').value = s; sendMessage(new Event('submit')); };
      sugContainer.appendChild(btn);
    });

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg) return;
      const messages = document.getElementById('messages');
      messages.innerHTML += `<div class="message user">${msg}</div>`;
      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        messages.innerHTML += `
          <div class="message bot">
            ${data.answer}
            <div class="meta">Matched: "${data.matched_faq}" · Confidence: ${(data.confidence * 100).toFixed(1)}%</div>
          </div>`;
      } catch (err) {
        messages.innerHTML += `<div class="message bot">Sorry, something went wrong. Try again.</div>`;
      }
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
